[workspace]
members = [
    "hysteria_core",
    "hysteria_cli",
    "hysteria_extras",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Hysteria Team"]
license = "MIT"
repository = "https://github.com/apernet/hysteria"
homepage = "https://hysteria.network"
description = "Hysteria 2 - A feature-packed proxy & relay tool optimized for lossy, unstable connections"

[workspace.dependencies]
# QUIC library
quinn = "0.11"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Cryptography
blake2 = "0.10"
rand = "0.9"

# Error handling
thiserror = "2"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Network utilities
byteorder = "1.4"
bytes = "1.0"

# Testing
tokio-test = "0.4"

# CLI framework
clap = { version = "4.0", features = ["derive", "env"] }

# ACME for automatic certificate management
rustls-acme = "0.10"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.0"
tokio-rustls = "0.26"

# Configuration
toml = "0.8"